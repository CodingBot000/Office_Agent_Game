services:
  office-agent-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: office-agent-backend
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./data:/app/data
    init: true
    cpus: 1.0
    mem_limit: 384m
